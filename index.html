<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>嘶く · 练习</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1f;--mute:#6b6b70;--line:#dcd9d1;--card:#fff;--accent:#1f6f43;--accent-fg:#fff;--sel:#dff0e5;--hot:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#17171a;--fg:#ececee;--mute:#9a9aa2;--line:#33333a;--card:#202024;--accent:#58c58c;--accent-fg:#0d1f15;--sel:#1e3628;--hot:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 12px}
h1{font-size:20px;margin:14px 0 4px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
h1 small{font-size:14px;font-weight:400;color:var(--mute)}
h1 a{margin-left:auto;font-size:15px;font-weight:400;color:var(--accent)}
.transport{display:flex;align-items:center;gap:16px}
#play{width:76px;height:76px;flex:none;border:0;border-radius:50%;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:grid;place-items:center}
#play svg{width:34px;height:34px;fill:currentColor}
#now{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
#now small{display:block;margin-top:4px;font-size:15px;font-weight:400;color:var(--mute)}
#picked{margin-left:auto;text-align:right;font-size:15px;color:var(--mute);min-width:0}
#whole{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
#whole:disabled{visibility:hidden}
#picked b{display:block;font-size:19px;color:var(--fg);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.row>span{flex:none;width:3em;font-size:13px;color:var(--mute)}
.btn{flex:none;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.gap{flex:none;width:12px}
main{padding:8px 0 48px}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
.sec{display:block;margin:18px 0 6px;padding:4px 0;border:0;background:none;color:var(--fg);font:inherit;font-size:17px;font-weight:600;cursor:pointer;text-align:left}
.sec small{margin-left:8px;font-size:13px;font-weight:400;color:var(--mute)}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.bar{min-height:64px;padding:6px 9px;display:block;vertical-align:top;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer;min-width:0}
.bar b{display:block;font-size:21px;line-height:1.25;font-variant-numeric:tabular-nums}
.bar span{display:block;font-size:12.5px;line-height:1.35;color:var(--mute)}
.bar i{display:inline-block;margin-right:7px;font-style:normal;white-space:nowrap}
.bar.sel{background:var(--sel);border-color:var(--accent)}
.bar.play{border-color:var(--hot);box-shadow:inset 0 0 0 2px var(--hot)}
.bar.sel.play{background:var(--sel)}
#error{display:none;margin-top:10px;padding:8px 12px;border:1px solid var(--hot);border-radius:10px;color:var(--hot);font-size:14px}
@media(max-width:560px){.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}#now{font-size:26px}#play{width:64px;height:64px}#picked b{font-size:16px}.bars{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
</style></head><body>
<div class="wrap"><h1>嘶く <small>6/8 · 附点四分音符 = 77 · 128 小节</small></h1></div>
<header><div class="wrap">
<div class="transport">
<button id="play" aria-label="播放"><svg viewBox="0 0 24 24"><path id="icon" d="M8 5v14l11-7z"/></svg></button>
<div id="now">小节 –<small>&nbsp;</small></div>
<div id="picked"></div>
<button id="whole" title="取消选择" aria-label="取消选择">✕</button>
</div>
<div class="row" id="parts"><span>声部</span></div>
<div class="row" id="options"><span>速度</span></div>
<div id="error"></div>
</div></header>
<main><div class="wrap">
<p class="hint">点一个小节选中它，再点另一个小节就选中两者之间的全部小节；点段落名选中整段。空格 播放/暂停，← → 把选区前后移一小节，L 开关循环。</p>
<div id="grid"></div>
</div></main>
<script>
const D={"bars": [1.5517, 3.1038, 4.6545, 6.2083, 7.7593, 9.3111, 10.8607, 12.4121, 13.9645, 15.5152, 17.0676, 18.6193, 20.171, 21.7241, 23.2759, 24.8286, 26.3814, 27.9324, 29.4852, 31.0352, 32.5876, 34.1383, 35.6903, 37.2414, 38.791, 40.3434, 41.8938, 43.4469, 44.9979, 46.5503, 48.1028, 49.6538, 51.2076, 52.759, 54.3104, 55.8617, 57.4124, 58.9655, 60.5159, 62.0686, 63.6203, 65.171, 66.7238, 68.2752, 69.8283, 71.3786, 72.9303, 74.4831, 76.0334, 77.5866, 79.1376, 80.6903, 82.2421, 83.7928, 85.3462, 86.8965, 88.4489, 90.0007, 91.5517, 93.1045, 94.6565, 96.209, 97.7607, 99.3117, 100.8641, 102.4148, 103.9676, 105.5186, 107.0696, 108.6204, 110.1711, 111.7241, 113.2748, 114.8283, 116.38, 117.9317, 119.4838, 121.0341, 122.5869, 124.1372, 125.6896, 127.2407, 128.7911, 130.3435, 131.8948, 133.4483, 135.0007, 136.5521, 138.1021, 139.6521, 141.2055, 142.7541, 144.3062, 145.8579, 147.4096, 148.9621, 150.5141, 152.0683, 153.6179, 155.171, 156.7245, 158.2741, 159.8266, 161.3779, 162.9304, 164.4831, 166.0352, 167.5879, 169.1393, 170.691, 172.2438, 173.7952, 175.3479, 176.8993, 178.451, 180.0028, 181.5524, 183.1062, 184.6562, 186.2083, 187.7593, 189.3104, 190.8628, 192.4134, 193.9669, 195.5179, 197.0707, 198.6221, 200.1735], "pulses": 6, "tracks": [{"key": "full", "label": "原曲", "src": "audio/full.m4a"}, {"key": "instrum", "label": "伴奏", "src": "audio/instrum.m4a"}, {"key": "vocal", "label": "人声", "src": "audio/vocal.m4a"}, {"key": "guitar", "label": "吉他（合）", "src": "audio/guitar.m4a"}, {"key": "lead", "label": "主音吉他", "src": "audio/lead.m4a"}, {"key": "rhythm", "label": "节奏吉他", "src": "audio/rhythm.m4a"}, {"key": "acoustic", "label": "原声吉他", "src": "audio/acoustic.m4a"}, {"key": "piano", "label": "键盘", "src": "audio/piano.m4a"}, {"key": "bass", "label": "贝斯", "src": "audio/bass.m4a"}, {"key": "drums", "label": "鼓", "src": "audio/drums.m4a"}], "sections": {"1": "Intro", "5": "Riff", "13": "A", "29": "B", "39": "Chorus", "56": "Interlude", "64": "A2", "72": "B2", "81": "Bridge", "85": "Solo", "91": "Chorus (soft)", "99": "Last Chorus", "115": "Ending", "121": "Outro"}, "chords": {"1": "C G", "2": "D#dim7 Em", "3": "C G", "4": "D#dim7 Em", "5": "C G/B", "6": "D#dim7 Em", "7": "C G/B", "8": "D#dim7 Em", "9": "C G/B", "10": "D#dim7 Em", "11": "C G/B", "12": "D#dim7 Em", "13": "C", "14": "G/B", "15": "Adim7", "16": "Em", "17": "C", "18": "G/B", "19": "Adim7", "20": "Em", "21": "C", "22": "G/B", "23": "Adim7", "24": "Em", "25": "C", "26": "G/B", "27": "Adim7", "28": "Em", "29": "F", "30": "Em", "31": "D", "32": "G", "33": "Cadd9 D", "34": "Bm7 Em7", "35": "Am7", "36": "Eb6", "37": "D", "38": "E", "39": "Aadd9", "40": "G#m7b5 C#7", "41": "F#m7", "42": "Em A7", "43": "Dadd9 E", "44": "C#m7 F#m7", "45": "Bm7", "46": "C#m7 E/B", "47": "Aadd9", "48": "G#m7b5 C#7", "49": "F#m7", "50": "Em A7", "51": "Dadd9 E", "52": "C#m7 F#m7", "53": "Bm7", "54": "Dm7 Em7/C# G/A", "55": "Aadd9", "56": "C G/B", "57": "D#dim7 Em", "58": "C G/B", "59": "D#dim7 Em", "60": "C G/B", "61": "D#dim7 Em", "62": "C G/B", "63": "D#dim7 Em", "64": "C", "65": "G/B", "66": "Adim7", "67": "Em", "68": "C", "69": "G/B", "70": "Adim7", "71": "Em", "72": "F", "73": "Em", "74": "D", "75": "G", "76": "Cadd9 D", "77": "Bm7 Em7", "78": "Am7", "79": "Eb6", "80": "D", "81": "Cadd9", "82": "G/B", "83": "Adim7", "84": "Em", "85": "Cadd9 D", "86": "Bm7 Em7", "87": "C", "88": "Eb6", "89": "D", "90": "Dsus4 D/F#", "91": "Gadd9", "92": "F#m7b5 B7", "93": "Em", "94": "Dm7 G7", "95": "C/E D/F#", "96": "Bm7/A Em7/B", "97": "Am7", "98": "D E", "99": "Aadd9", "100": "G#m7b5 C#7", "101": "F#m7", "102": "Em A7", "103": "Dadd9 E", "104": "C#m7 F#m7", "105": "Bm7", "106": "C#m7 E/B", "107": "Aadd9", "108": "G#m7b5 C#7", "109": "F#m7", "110": "Em A7", "111": "Dadd9 E", "112": "C#m7 F#m7", "113": "Bm7", "114": "Dm7 Em7/C# G/A", "115": "F#m7", "116": "F#7", "117": "Dadd9 E", "118": "C#m7 F#m7", "119": "Bm7", "120": "E", "121": "D A/C#", "122": "Fdim7 F#m7", "123": "D A/C#", "124": "Fdim7 F#m7", "125": "D A/C#", "126": "Fdim7 F#m7", "127": "D A/C#", "128": "Fdim7 A"}};
const N=D.bars.length-1,$=id=>document.getElementById(id);
const PLAY='M8 5v14l11-7z',PAUSE='M6 5h4v14H6zm8 0h4v14h-4z';
const audios={};let cur=null,curKey='',wanted=D.bars[0],going=false,rate=1,loop=true,lead=false,sel=null,pending=false,shown=0;
function fmt(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
// going = the listener wants sound; wanted = where playback should be. A part that is still loading
// picks both up when its metadata arrives, so switching parts never restarts from the top.
function load(key){if(!audios[key]){const a=new Audio();a.preload='auto';a.src=D.tracks.find(t=>t.key===key).src;
  a.addEventListener('loadedmetadata',()=>{if(a!==cur)return;a.currentTime=wanted;a.playbackRate=rate;if(going)a.play().catch(()=>{})});
  a.addEventListener('timeupdate',()=>{if(a===cur)control()});
  a.addEventListener('ended',()=>{if(a!==cur)return;seek(enter());if(loop)a.play().catch(()=>{});else stop()});
  a.addEventListener('error',()=>{const e=$('error');e.style.display='block';e.textContent='音频没有找到：'+a.getAttribute('src')+'。请把压缩包整个解压后，再打开文件夹里的 index.html。'});
  audios[key]=a}return audios[key]}
function ready(){return cur&&cur.readyState>=1}
function now(){return ready()?cur.currentTime:wanted}
function seek(t){wanted=t;if(ready())cur.currentTime=t}
function start(){going=true;if(ready())cur.play().catch(()=>{});paintPlay()}
function stop(){going=false;if(cur)cur.pause();paintPlay()}
function region(){const a=sel?sel.a:1,b=sel?sel.b:N;return{a,b,start:D.bars[a-1],end:D.bars[b]}}
function enter(){const r=region();return lead&&r.a>1?D.bars[r.a-2]:r.start}
function setPart(key){const t=now();if(cur)cur.pause();cur=load(key);curKey=key;cur.playbackRate=rate;seek(t);if(going&&ready())cur.play().catch(()=>{});
  document.querySelectorAll('#parts .btn').forEach(b=>b.classList.toggle('on',b.dataset.key===key))}
function toggle(){if(going){stop();return}const r=region(),t=now();if(t<enter()-0.02||t>=r.end-0.05)seek(enter());start()}
function paintPlay(){const on=going;$('icon').setAttribute('d',on?PAUSE:PLAY);$('play').setAttribute('aria-label',on?'暂停':'播放')}
function paintSel(){for(let i=1;i<=N;i++)$('b'+i).classList.toggle('sel',!!sel&&i>=sel.a&&i<=sel.b);
  const p=$('picked');$('whole').disabled=!sel;
  if(!sel)p.innerHTML='<b>整首歌</b>没有选小节';
  else if(sel.a===sel.b)p.innerHTML='<b>第 '+sel.a+' 小节</b>'+(pending?'再点一个小节可选到那里':fmt(D.bars[sel.a-1]));
  else p.innerHTML='<b>'+sel.a+' – '+sel.b+' 小节</b>共 '+(sel.b-sel.a+1)+' 小节 · '+fmt(D.bars[sel.a-1])+' – '+fmt(D.bars[sel.b])}
function pick(a,b,wait){sel={a:Math.max(1,Math.min(a,b)),b:Math.min(N,Math.max(a,b))};pending=!!wait;paintSel();seek(enter())}
function tapBar(i){if(pending&&sel&&i!==sel.a)pick(sel.a,i,false);else if(pending&&sel){pending=false;paintSel()}else pick(i,i,true)}
function barAt(t){if(t<D.bars[0])return 0;let lo=0,hi=N;while(lo<hi-1){const mid=(lo+hi)>>1;if(D.bars[mid]<=t)lo=mid;else hi=mid}return lo+1}
// The end of the selection is watched by a timer, not by the paint loop: browsers stop painting a tab
// that is in the background (say, while the score PDF is open), but the music must still loop.
function control(){if(going&&ready()&&now()>=region().end-0.02){seek(enter());if(!loop)stop()}}
function tick(){const t=now();
  const bar=barAt(t);if(bar!==shown){if(shown)$('b'+shown).classList.remove('play');shown=bar;if(bar)$('b'+bar).classList.add('play')}
  if(bar){const a=D.bars[bar-1],b=D.bars[bar],beat=Math.min(D.pulses,Math.floor((t-a)/(b-a)*D.pulses)+1);
    $('now').innerHTML='小节 '+bar+'<small>第 '+beat+' / '+D.pulses+' 拍 · '+fmt(t)+'</small>'}
  else $('now').innerHTML='小节 –<small>'+fmt(t)+'</small>';
  requestAnimationFrame(tick)}
function button(parent,text,onclick,cls){const b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');b.textContent=text;b.onclick=onclick;parent.appendChild(b);return b}
D.tracks.forEach(t=>{button($('parts'),t.label,()=>setPart(t.key)).dataset.key=t.key});
const opts=$('options');
[0.5,0.6,0.75,0.9,1].forEach(v=>{const b=button(opts,v+'×',()=>{rate=v;cur.playbackRate=v;opts.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===b))},v===1?'on':'');b.dataset.rate=v});
opts.insertAdjacentHTML('beforeend','<i class="gap"></i>');
const loopBtn=button(opts,'循环',()=>{loop=!loop;loopBtn.classList.toggle('on',loop)},'on');
const leadBtn=button(opts,'提前一小节进入',()=>{lead=!lead;leadBtn.classList.toggle('on',lead);if(!going)seek(enter())});
$('whole').onclick=()=>{sel=null;pending=false;paintSel()};
const grid=$('grid'),starts=Object.keys(D.sections).map(Number).sort((a,b)=>a-b);if(starts[0]!==1)starts.unshift(1);
starts.forEach((s,k)=>{const e=(starts[k+1]||N+1)-1;if(s>N)return;const h=document.createElement('button');h.className='sec';
  h.innerHTML=(D.sections[s]||'')+'<small>'+s+' – '+Math.min(e,N)+' 小节</small>';h.onclick=()=>pick(s,Math.min(e,N),false);grid.appendChild(h);
  const box=document.createElement('div');box.className='bars';grid.appendChild(box);
  for(let i=s;i<=Math.min(e,N);i++){const b=document.createElement('button');b.className='bar';b.id='b'+i;
    // one chord per unbreakable chip, so a bar with several chords wraps to a second line instead of being cut off
    b.innerHTML='<b>'+i+'</b><span>'+(D.chords[i]?D.chords[i].split(' ').map(c=>'<i>'+c+'</i>').join(''):'&nbsp;')+'</span>';b.onclick=()=>tapBar(i);box.appendChild(b)}});
$('play').onclick=toggle;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.code==='Space'){e.preventDefault();e.target.blur()}
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='l'||e.key==='L'){loopBtn.click()}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const d=e.key==='ArrowRight'?1:-1;
    if(sel){const len=sel.b-sel.a,a=Math.max(1,Math.min(N-len,sel.a+d));pick(a,a+len,false)}
    else{const bar=Math.max(1,Math.min(N,Math.max(barAt(now()),1)+d));seek(D.bars[bar-1])}}});
D.tracks.forEach(t=>load(t.key));setPart(D.tracks[0].key);paintSel();setInterval(control,25);requestAnimationFrame(tick);
</script></body></html>
